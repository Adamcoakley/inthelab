<path d="M595.38 192 L598.9 195.74 L605.06 187.82" class="s-ok" fill="none" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
<text x="600" y="222" class="f-ink" font-size="11" font-weight="500" text-anchor="middle">ready</text>
<text x="330" y="180" class="f-you" font-size="10.5" font-weight="600" text-anchor="middle">no SSH, no typing</text>
</svg>