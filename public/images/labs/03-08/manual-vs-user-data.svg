<text x="600" y="88" class="f-ink" font-size="11" font-weight="500" text-anchor="middle">ready</text>
<text x="20" y="116" class="f-sub" font-size="10.5" font-weight="400" text-anchor="start">every step is you, every time</text>
<path d="M20 134 L640 134" class="s-faint" fill="none" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/>
