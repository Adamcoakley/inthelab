<path d="M346 192 L578.0 192.0" class="s-faint" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="584.0,192.0 574.0,187.0 574.0,197.0" class="f-faint"/>
