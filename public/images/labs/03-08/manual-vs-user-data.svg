<text x="465" y="88" class="f-ink" font-size="11" font-weight="500" text-anchor="middle">set up service</text>
<path d="M481 58 L578.0 58.0" class="s-faint" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="584.0,58.0 574.0,53.0 574.0,63.0" class="f-faint"/>
