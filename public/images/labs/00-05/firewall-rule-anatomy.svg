<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 660 330"><title>A firewall rule's four parts, and a small rule list ending with block everything else</title><style>.dg text{font-family:Inter,'Amazon Ember',Arial,Helvetica,sans-serif}.dg .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}.dg .f-ink{fill:var(--dg-ink,#232F3E)}.dg .s-ink{stroke:var(--dg-ink,#232F3E)}.dg .f-sub{fill:var(--dg-sub,#5F6B7A)}.dg .s-sub{stroke:var(--dg-sub,#5F6B7A)}.dg .f-faint{fill:var(--dg-faint,#A7B1BE)}.dg .s-faint{stroke:var(--dg-faint,#A7B1BE)}.dg .f-line{fill:var(--dg-line,#232F3E)}.dg .s-line{stroke:var(--dg-line,#232F3E)}.dg .f-surface{fill:var(--dg-surface,#F4F6F8)}.dg .s-surface{stroke:var(--dg-surface,#F4F6F8)}.dg .f-panel{fill:var(--dg-panel,#FFFFFF)}.dg .s-panel{stroke:var(--dg-panel,#FFFFFF)}.dg .f-net{fill:var(--dg-net,#8C4FFF)}.dg .s-net{stroke:var(--dg-net,#8C4FFF)}.dg .f-cmp{fill:var(--dg-cmp,#ED7100)}.dg .s-cmp{stroke:var(--dg-cmp,#ED7100)}.dg .f-pub{fill:var(--dg-pub,#7AA116)}.dg .s-pub{stroke:var(--dg-pub,#7AA116)}.dg .f-priv{fill:var(--dg-priv,#00A4A6)}.dg .s-priv{stroke:var(--dg-priv,#00A4A6)}.dg .f-sec{fill:var(--dg-sec,#DD344C)}.dg .s-sec{stroke:var(--dg-sec,#DD344C)}.dg .f-db{fill:var(--dg-db,#C925D1)}.dg .s-db{stroke:var(--dg-db,#C925D1)}.dg .f-you{fill:var(--dg-you,#3B62D4)}.dg .s-you{stroke:var(--dg-you,#3B62D4)}.dg .f-ok{fill:var(--dg-ok,#037F0C)}.dg .s-ok{stroke:var(--dg-ok,#037F0C)}.dg .f-bad{fill:var(--dg-bad,#D91515)}.dg .s-bad{stroke:var(--dg-bad,#D91515)}.dg .f-pubtint{fill:var(--dg-pubtint,#F2F6E8)}.dg .s-pubtint{stroke:var(--dg-pubtint,#F2F6E8)}.dg .f-privtint{fill:var(--dg-privtint,#E6F6F7)}.dg .s-privtint{stroke:var(--dg-privtint,#E6F6F7)}.dg .f-youtint{fill:var(--dg-youtint,#EEF2FC)}.dg .s-youtint{stroke:var(--dg-youtint,#EEF2FC)}.dg .f-nettint{fill:var(--dg-nettint,#F3EEFF)}.dg .s-nettint{stroke:var(--dg-nettint,#F3EEFF)}.dg .f-badtint{fill:var(--dg-badtint,#FDECEC)}.dg .s-badtint{stroke:var(--dg-badtint,#FDECEC)}</style>
<text x="95" y="22" class="f-sub" font-size="10.5" font-weight="400" text-anchor="middle">protocol</text>
<rect x="30" y="32" width="130" height="46" rx="6" class="s-ink f-panel" stroke-width="1.6"/>
<text x="95.0" y="60.4" class="f-ink mono" font-size="15" font-weight="500" text-anchor="middle">TCP</text>
<path d="M95 80 L95 92" class="s-faint" fill="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="95" y="108" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">how is it</text>
<text x="95" y="122" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">carried?</text>
<text x="249" y="22" class="f-sub" font-size="10.5" font-weight="400" text-anchor="middle">port</text>
<rect x="184" y="32" width="130" height="46" rx="6" class="s-ink f-panel" stroke-width="1.6"/>
<text x="249.0" y="60.4" class="f-ink mono" font-size="15" font-weight="500" text-anchor="middle">443</text>
<path d="M249 80 L249 92" class="s-faint" fill="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="249" y="108" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">which</text>
<text x="249" y="122" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">service?</text>
<text x="403" y="22" class="f-sub" font-size="10.5" font-weight="400" text-anchor="middle">source</text>
<rect x="338" y="32" width="130" height="46" rx="6" class="s-ink f-panel" stroke-width="1.6"/>
<text x="403.0" y="60.4" class="f-ink mono" font-size="15" font-weight="500" text-anchor="middle">anywhere</text>
<path d="M403 80 L403 92" class="s-faint" fill="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="403" y="108" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">who is it</text>
<text x="403" y="122" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">from?</text>
<text x="557" y="22" class="f-sub" font-size="10.5" font-weight="400" text-anchor="middle">action</text>
<rect x="492" y="32" width="130" height="46" rx="6" class="s-ok f-panel" stroke-width="1.6"/>
<text x="557.0" y="60.4" class="f-ok mono" font-size="15" font-weight="500" text-anchor="middle">ALLOW</text>
<path d="M557 80 L557 92" class="s-faint" fill="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="557" y="108" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">let it</text>
<text x="557" y="122" class="f-sub" font-size="10" font-weight="400" text-anchor="middle">through?</text>
<path d="M30 146 L630 146" class="s-faint" fill="none" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="30" y="168" class="f-sub" font-size="10.5" font-weight="400" text-anchor="start">a small rule list</text>
<rect x="30" y="178" width="600" height="30" rx="5" class="s-faint f-surface" stroke-width="1.2"/>
<text x="95" y="198" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">TCP</text>
<text x="249" y="198" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">443</text>
<text x="403" y="198" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">anywhere</text>
<text x="557" y="198" class="f-ok mono" font-size="11" font-weight="600" text-anchor="middle">ALLOW</text>
<rect x="30" y="216" width="600" height="30" rx="5" class="s-faint f-surface" stroke-width="1.2"/>
<text x="95" y="236" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">TCP</text>
<text x="249" y="236" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">22</text>
<text x="403" y="236" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">office IP only</text>
<text x="557" y="236" class="f-ok mono" font-size="11" font-weight="600" text-anchor="middle">ALLOW</text>
<rect x="30" y="254" width="600" height="30" rx="5" class="s-bad f-badtint" stroke-width="1.2"/>
<text x="95" y="274" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">any</text>
<text x="249" y="274" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">any</text>
<text x="403" y="274" class="f-ink mono" font-size="11" font-weight="400" text-anchor="middle">everything else</text>
<text x="557" y="274" class="f-bad mono" font-size="11" font-weight="600" text-anchor="middle">BLOCK</text>
<text x="330" y="312" class="f-bad" font-size="10.5" font-weight="600" text-anchor="middle">if no rule allows it, it's blocked</text>
</svg>