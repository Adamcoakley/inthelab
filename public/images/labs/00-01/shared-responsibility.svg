<defs><filter id="shared-responsibility-s6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

<g filter="url(#shared-responsibility-s6)"><rect x="46" y="26" width="250" height="200" rx="12" stroke-width="1.6" style="fill:var(--dg-cmptint,#FFDFC9);stroke:var(--dg-cmp,#D16100)"/></g>

<text x="171" y="50" font-family="JetBrains Mono" font-size="11.5" text-anchor="middle" style="fill:var(--dg-cmp-text,#A34202)">YOURS</text>

<text x="171" y="66" font-family="JetBrains Mono" font-size="9" text-anchor="middle" style="fill:var(--dg-mute,#6B7A8F)">security IN the cloud</text>

<text x="70" y="94" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">your application code</text>

<text x="70" y="118" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">the operating system and patches</text>

<text x="70" y="142" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">who can log in, and how</text>

<text x="70" y="166" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">firewall rules you configure</text>

<text x="70" y="190" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">your data, and its encryption</text>

<line x1="310" y1="40" x2="310" y2="212" stroke-width="1.5" stroke-dasharray="4 4" style="stroke:var(--dg-edge,#A3B1C2)"/>

<g filter="url(#shared-responsibility-s6)"><rect x="324" y="26" width="250" height="200" rx="12" stroke-width="1.6" style="fill:var(--dg-privtint,#C4F0EB);stroke:var(--dg-priv,#0A847F)"/></g>

<text x="449" y="50" font-family="JetBrains Mono" font-size="11.5" text-anchor="middle" style="fill:var(--dg-priv-text,#02736E)">AWS</text>

<text x="449" y="66" font-family="JetBrains Mono" font-size="9" text-anchor="middle" style="fill:var(--dg-mute,#6B7A8F)">security OF the cloud</text>

<text x="348" y="94" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">the physical buildings</text>

<text x="348" y="118" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">the hardware and racks</text>

<text x="348" y="142" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">the virtualisation layer</text>

<text x="348" y="166" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">power, cooling, guards</text>

<text x="348" y="190" font-family="Inter" font-size="11" style="fill:var(--dg-ink2,#3E4C5E)">the network between Regions</text>

<text x="310" y="246" font-family="JetBrains Mono" font-size="10" text-anchor="middle" style="fill:var(--dg-mute,#6B7A8F)">the line sits exactly where your virtual machine begins</text>

