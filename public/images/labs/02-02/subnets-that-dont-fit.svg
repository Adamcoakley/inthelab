<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,'DejaVu Sans Mono',Menlo,Consolas,monospace}</style>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#F2739D" stroke-width="2" opacity="0.45"/></pattern></defs>
<text x="30" y="24" fill="#F2739D" font-family="JetBrains Mono" font-size="10" text-anchor="start">1. outside the VPC</text>
<rect x="30" y="38" width="400" height="40" rx="5" fill="#8B7BF0" fill-opacity="0.08" stroke="#8B7BF0" stroke-width="1.5"/>
<text x="230" y="62" fill="#8B7BF0" font-family="JetBrains Mono" font-size="10" text-anchor="middle">your VPC: 10.0.0.0/16</text>
<text x="30" y="94" fill="#5B7290" font-family="JetBrains Mono" font-size="9" text-anchor="start">10.0.0.0</text>
<text x="230" y="94" fill="#8B7BF0" font-family="JetBrains Mono" font-size="9" text-anchor="middle">every address starts with 10.0</text>
<text x="430" y="94" fill="#5B7290" font-family="JetBrains Mono" font-size="9" text-anchor="end">10.0.255.255</text>
<rect x="470" y="38" width="120" height="40" rx="5" fill="#F2739D" fill-opacity="0.06" stroke="#F2739D" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="530" y="62" fill="#F2739D" font-family="JetBrains Mono" font-size="10" text-anchor="middle">10.1.0.0/24</text>
<circle cx="450" cy="58" r="9" fill="#0A1220" stroke="#F2739D" stroke-width="1.7"/>
<line x1="444.42" y1="52.42" x2="455.58" y2="63.58" stroke="#F2739D" stroke-width="1.7"/>
<text x="530" y="94" fill="#F2739D" font-family="JetBrains Mono" font-size="9" text-anchor="middle">starts with 10.1,</text>
<text x="530" y="107" fill="#F2739D" font-family="JetBrains Mono" font-size="9" text-anchor="middle">not 10.0</text>
<text x="30" y="134" fill="#F2739D" font-family="JetBrains Mono" font-size="10" text-anchor="start">2. overlapping public-a</text>
<rect x="310" y="148" width="280" height="34" rx="5" fill="#F2739D" fill-opacity="0.06" stroke="#F2739D" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="450" y="169" fill="#F2739D" font-family="JetBrains Mono" font-size="10" text-anchor="middle">test: 10.0.1.128/25</text>
<rect x="30" y="192" width="560" height="40" rx="5" fill="#22C7B8" fill-opacity="0.08" stroke="#22C7B8" stroke-width="1.5"/>
<rect x="311" y="193" width="278" height="38" rx="4" fill="url(#hatch)"/>
<line x1="310" y1="192" x2="310" y2="232" stroke="#22C7B8" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="170" y="216" fill="#22C7B8" font-family="JetBrains Mono" font-size="10" text-anchor="middle">10.0.1.0 to .127</text>
<rect x="384" y="203" width="132" height="18" rx="4" fill="#0A1220" opacity="0.85"/>
<text x="450" y="216" fill="#F2739D" font-family="JetBrains Mono" font-size="10" text-anchor="middle">10.0.1.128 to .255</text>
<text x="30" y="252" fill="#22C7B8" font-family="JetBrains Mono" font-size="9.5" text-anchor="start">public-a: 10.0.1.0/24</text>
<text x="450" y="252" fill="#F2739D" font-family="JetBrains Mono" font-size="9.5" text-anchor="middle">already belongs to public-a</text>
</svg>