<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 660 280"><title>10.1.0.0/24 sits outside the VPC; 10.0.1.128/25 overlaps the second half of public-a</title><style>.dg text{font-family:Inter,'Amazon Ember',Arial,Helvetica,sans-serif}.dg .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}.dg .f-ink{fill:var(--dg-ink,#232F3E)}.dg .s-ink{stroke:var(--dg-ink,#232F3E)}.dg .f-sub{fill:var(--dg-sub,#5F6B7A)}.dg .s-sub{stroke:var(--dg-sub,#5F6B7A)}.dg .f-faint{fill:var(--dg-faint,#A7B1BE)}.dg .s-faint{stroke:var(--dg-faint,#A7B1BE)}.dg .f-line{fill:var(--dg-line,#232F3E)}.dg .s-line{stroke:var(--dg-line,#232F3E)}.dg .f-surface{fill:var(--dg-surface,#F4F6F8)}.dg .s-surface{stroke:var(--dg-surface,#F4F6F8)}.dg .f-panel{fill:var(--dg-panel,#FFFFFF)}.dg .s-panel{stroke:var(--dg-panel,#FFFFFF)}.dg .f-net{fill:var(--dg-net,#8C4FFF)}.dg .s-net{stroke:var(--dg-net,#8C4FFF)}.dg .f-cmp{fill:var(--dg-cmp,#ED7100)}.dg .s-cmp{stroke:var(--dg-cmp,#ED7100)}.dg .f-pub{fill:var(--dg-pub,#7AA116)}.dg .s-pub{stroke:var(--dg-pub,#7AA116)}.dg .f-priv{fill:var(--dg-priv,#00A4A6)}.dg .s-priv{stroke:var(--dg-priv,#00A4A6)}.dg .f-sec{fill:var(--dg-sec,#DD344C)}.dg .s-sec{stroke:var(--dg-sec,#DD344C)}.dg .f-db{fill:var(--dg-db,#C925D1)}.dg .s-db{stroke:var(--dg-db,#C925D1)}.dg .f-you{fill:var(--dg-you,#3B62D4)}.dg .s-you{stroke:var(--dg-you,#3B62D4)}.dg .f-ok{fill:var(--dg-ok,#037F0C)}.dg .s-ok{stroke:var(--dg-ok,#037F0C)}.dg .f-bad{fill:var(--dg-bad,#D91515)}.dg .s-bad{stroke:var(--dg-bad,#D91515)}.dg .f-pubtint{fill:var(--dg-pubtint,#F2F6E8)}.dg .s-pubtint{stroke:var(--dg-pubtint,#F2F6E8)}.dg .f-privtint{fill:var(--dg-privtint,#E6F6F7)}.dg .s-privtint{stroke:var(--dg-privtint,#E6F6F7)}.dg .f-youtint{fill:var(--dg-youtint,#EEF2FC)}.dg .s-youtint{stroke:var(--dg-youtint,#EEF2FC)}.dg .f-nettint{fill:var(--dg-nettint,#F3EEFF)}.dg .s-nettint{stroke:var(--dg-nettint,#F3EEFF)}.dg .f-badtint{fill:var(--dg-badtint,#FDECEC)}.dg .s-badtint{stroke:var(--dg-badtint,#FDECEC)}</style>
<text x="30" y="22" class="f-bad" font-size="11" font-weight="600" text-anchor="start">1. outside the VPC</text>
<rect x="30" y="36" width="400" height="40" rx="5" class="s-net f-nettint" stroke-width="1.6"/>
<text x="230" y="61" class="f-net mono" font-size="11.5" font-weight="600" text-anchor="middle">your VPC: 10.0.0.0/16</text>
<text x="30" y="94" class="f-sub mono" font-size="9.5" font-weight="400" text-anchor="start">10.0.0.0</text>
<text x="230" y="94" class="f-net" font-size="10" font-weight="400" text-anchor="middle">every address starts with 10.0</text>
<text x="430" y="94" class="f-sub mono" font-size="9.5" font-weight="400" text-anchor="end">10.0.255.255</text>
<circle cx="452" cy="56" r="9" class="f-panel s-bad" stroke-width="1.8"/>
<path d="M446.78 50.78 L457.22 61.22" class="s-bad" fill="none" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="474" y="36" width="156" height="40" rx="5" class="s-bad f-badtint" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="552" y="61" class="f-bad mono" font-size="11.5" font-weight="600" text-anchor="middle">10.1.0.0/24</text>
<text x="552" y="94" class="f-bad" font-size="10" font-weight="400" text-anchor="middle">starts with 10.1</text>
<text x="30" y="136" class="f-bad" font-size="11" font-weight="600" text-anchor="start">2. overlapping public-a</text>
<rect x="330" y="150" width="300" height="34" rx="5" class="s-bad f-badtint" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="480" y="172" class="f-bad mono" font-size="11.5" font-weight="600" text-anchor="middle">test: 10.0.1.128/25</text>
<rect x="30" y="196" width="600" height="42" rx="5" class="s-pub f-pubtint" stroke-width="1.6"/>
<defs><pattern id="dg-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="s-bad" stroke-width="2" opacity=".45"/></pattern></defs>
<rect x="331" y="197" width="298" height="40" rx="4" fill="url(#dg-hatch)"/>
<path d="M330 196 L330 238" class="s-pub" fill="none" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="180" y="222" class="f-pub mono" font-size="11" font-weight="600" text-anchor="middle">10.0.1.0 to .127</text>
<rect x="400" y="207" width="160" height="20" rx="4" class="f-panel" stroke-width="0"/>
<text x="480" y="222" class="f-bad mono" font-size="11" font-weight="600" text-anchor="middle">10.0.1.128 to .255</text>
<text x="30" y="262" class="f-pub mono" font-size="10.5" font-weight="400" text-anchor="start">public-a: 10.0.1.0/24</text>
<text x="480" y="262" class="f-bad" font-size="10.5" font-weight="400" text-anchor="middle">already belongs to public-a</text>
</svg>